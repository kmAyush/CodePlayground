<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>हिंदी Python Playground</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>🔵 हिंदी Python Playground</h1>
    <button id="theme-toggle" class="icon-btn" type="button">🌙 Dark</button>
  </header>

  <main class="panels code-panels">
    <section class="panel">
      <h2 class="panel-title">English Panel</h2>
      <div id="english-editor" class="editor-mount english-panel"></div>
    </section>
    <section class="panel">
      <h2 class="panel-title">Hindi Panel</h2>
      <div id="hindi-editor" class="editor-mount hindi-panel"></div>
    </section>
  </main>

  <div class="controls">
    <div class="controls-buttons">
      <button id="run-btn" class="btn btn-primary" type="button">▶ चलाओ / Run</button>
      <button id="reset-btn" class="btn" type="button">⟳ Reset</button>
      <button id="sync-btn" class="btn" type="button">↔ Sync</button>
    </div>
    <span id="status-indicator" class="status-pill" data-state="ready">Ready</span>
  </div>

  <section class="panels output-panels">
    <div class="panel">
      <h2 class="panel-title">English Output</h2>
      <pre id="english-output" class="output-panel english-output"></pre>
    </div>
    <div class="panel">
      <h2 class="panel-title">Hindi Output</h2>
      <pre id="hindi-output" class="output-panel hindi-output"></pre>
    </div>
  </section>

  <section class="panels error-panels">
    <div class="panel error-panel-wrap" id="english-error-wrap">
      <h2 class="panel-title">English Errors</h2>
      <pre id="english-error" class="output-panel english-error"></pre>
    </div>
    <div class="panel error-panel-wrap" id="hindi-error-wrap">
      <h2 class="panel-title">Hindi Errors</h2>
      <pre id="hindi-error" class="output-panel hindi-output hindi-error"></pre>
    </div>
  </section>

  <!--
    Monaco loads via its own AMD loader (require.js bundled inside it).
    Set the base path before the loader script runs, then boot editor.js
    once Monaco's define() infrastructure is ready.
    No importmap, no ESM version juggling — Monaco is one self-contained bundle.
  -->
  <script>var require = { paths: { vs: "https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs" } };</script>
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/loader.js"></script>
  <script>
    require(["vs/editor/editor.main"], function () {
      // Monaco is fully loaded — dynamically import our module so it can
      // access window.monaco which the AMD loader just populated.
      import("./editor.js");
    });
  </script>
</body>
</html>
